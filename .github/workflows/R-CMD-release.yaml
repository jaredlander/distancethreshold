# Workflow for building R package binaries for release
# Builds source package and binaries for Windows, macOS, and Linux distributions

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

name: Build R Package Release

jobs:
  build-source:
    runs-on: ubuntu-latest
    name: Build source package
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          
      - uses: r-lib/actions/setup-pandoc@v2
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          
      - name: Install dependencies
        run: |
          install.packages('remotes')
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        
      - name: Build source package
        run: |
          dir.create('build', showWarnings = FALSE)
          pkg <- pkgbuild::build('.', dest_path = 'build', binary = FALSE)
          cat('Built source package:', pkg, '\n')
        shell: Rscript {0}
        
      - name: Upload source package
        uses: actions/upload-artifact@v3
        with:
          name: source-package
          path: build/*.tar.gz
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    name: Build Windows binary
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          rtools-version: '43'
          
      - uses: r-lib/actions/setup-pandoc@v2
      
      - name: Install dependencies
        run: |
          install.packages('remotes')
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        
      - name: Build Windows binary
        run: |
          dir.create('build', showWarnings = FALSE)
          pkg <- pkgbuild::build('.', dest_path = 'build', binary = TRUE)
          cat('Built Windows binary:', pkg, '\n')
        shell: Rscript {0}
        
      - name: Upload Windows binary
        uses: actions/upload-artifact@v3
        with:
          name: windows-binary
          path: build/*.zip
          retention-days: 30

  build-macos:
    runs-on: ${{ matrix.config.os }}
    name: Build macOS binary (${{ matrix.config.arch }})
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, arch: 'arm64'}
          - {os: macos-13, arch: 'x86_64'}
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          
      - uses: r-lib/actions/setup-pandoc@v2
      
      - name: Install dependencies
        run: |
          install.packages('remotes')
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        
      - name: Build macOS binary
        run: |
          dir.create('build', showWarnings = FALSE)
          pkg <- pkgbuild::build('.', dest_path = 'build', binary = TRUE)
          cat('Built macOS binary:', pkg, '\n')
        shell: Rscript {0}
        
      - name: Upload macOS binary
        uses: actions/upload-artifact@v3
        with:
          name: macos-${{ matrix.config.arch }}-binary
          path: build/*.tgz
          retention-days: 30

  build-linux-ubuntu:
    runs-on: ubuntu-latest
    name: Build Linux binary (Ubuntu)
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          
      - uses: r-lib/actions/setup-pandoc@v2
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          
      - name: Install dependencies
        run: |
          install.packages('remotes')
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        
      - name: Build Ubuntu binary
        run: |
          dir.create('build', showWarnings = FALSE)
          pkg <- pkgbuild::build('.', dest_path = 'build', binary = TRUE)
          cat('Built Ubuntu binary:', pkg, '\n')
        shell: Rscript {0}
        
      - name: Upload Ubuntu binary
        uses: actions/upload-artifact@v3
        with:
          name: ubuntu-binary
          path: build/*.tar.gz
          retention-days: 30

  build-linux-rhel:
    runs-on: ubuntu-latest
    name: Build Linux binary (RHEL/Rocky)
    container:
      image: rockylinux:9
    
    steps:
      - name: Install git and system dependencies
        run: |
          dnf install -y git curl wget which
          
      - uses: actions/checkout@v3
      
      - name: Install R and dependencies
        run: |
          # Enable EPEL for R
          dnf install -y epel-release
          dnf install -y R libcurl-devel
          
      - name: Install pandoc
        run: |
          wget https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-linux-amd64.tar.gz
          tar xvzf pandoc-3.1.11-linux-amd64.tar.gz --strip-components 1 -C /usr/local/
          
      - name: Install R dependencies
        run: |
          R -e "install.packages('remotes', repos = 'https://cloud.r-project.org')"
          R -e "remotes::install_deps(dependencies = TRUE, repos = 'https://cloud.r-project.org')"
        
      - name: Build RHEL binary
        run: |
          R -e "dir.create('build', showWarnings = FALSE); pkg <- pkgbuild::build('.', dest_path = 'build', binary = TRUE); cat('Built RHEL binary:', pkg, '\n')"
        
      - name: Upload RHEL binary
        uses: actions/upload-artifact@v3
        with:
          name: rhel-binary
          path: build/*.tar.gz
          retention-days: 30
